<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TicianoFlix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23e50914'/><polygon points='10,6 10,26 26,16' fill='white'/></svg>">
<style>
  /* ====== RESET & BASE ====== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #141414;
    --bg2: #1a1a2e;
    --bg3: #222;
    --surface: #1e1e2e;
    --primary: #e50914;
    --primary-hover: #ff0f1f;
    --accent: #e50914;
    --text: #fff;
    --text2: #999;
    --text3: #666;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
  a { color: inherit; text-decoration: none; }

  /* ====== HEADER / NAVBAR ====== */
  .menu-toggle {
    background: none;
    border: none;
    color: var(--text);
    font-size: 28px;
    cursor: pointer;
    padding: 0 16px 0 0;
    display: flex;
    align-items: center;
    line-height: 1;
  }
  .menu-toggle:hover { opacity: 0.7; }
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    height: 68px;
    background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(20,20,20,0) 100%);
    transition: background var(--transition);
  }
  .header.scrolled {
    background: rgba(20,20,20,0.98);
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .logo {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -1px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .logo-icon { font-size: 32px; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 6px 16px;
    transition: all var(--transition);
  }
  .search-box:focus-within {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
  }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    width: 200px;
    padding: 6px 0;
  }
  .search-box input::placeholder { color: var(--text3); }
  .search-box .search-icon {
    font-size: 18px;
    margin-right: 8px;
    opacity: 0.5;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2);
    font-size: 16px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.12);
    color: var(--text);
  }
  .icon-btn.loading {
    animation: spin 0.8s linear infinite;
    pointer-events: none;
    opacity: 0.6;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3000;
    background: var(--surface);
    color: var(--text);
    padding: 12px 24px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: var(--shadow);
    font-size: 14px;
    display: none;
    animation: fadeIn 0.3s ease;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { display: block; }
  .toast.success { border-color: #4caf50; }
  .toast.error { border-color: var(--primary); }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--text2);
    max-width: 600px;
  }
  .breadcrumb a {
    color: var(--text2);
    cursor: pointer;
    transition: color var(--transition);
  }
  .breadcrumb a:hover { color: var(--text); }
  .breadcrumb .sep { color: var(--text3); }

  /* ====== SIDEBAR FIXA ====== */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 220px;
    height: 100vh;
    z-index: 3001;
    background: var(--bg2);
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 20px rgba(0,0,0,0.3);
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    padding: 20px 20px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-header .logo-text {
    font-size: 20px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -1px;
  }
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 14px;
    color: var(--text2);
    cursor: pointer;
    transition: all var(--transition);
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .sidebar-item:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }
  .sidebar-item.active {
    color: var(--text);
    background: rgba(229,9,20,0.1);
    border-left: 3px solid var(--primary);
  }
  .sidebar-item .icon { font-size: 16px; width: 22px; text-align: center; }
  .sidebar-section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text3);
    padding: 16px 20px 6px;
  }

  .sidebar-footer {
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 8px 0;
  }
  .sidebar-footer .sidebar-item {
    font-size: 13px;
    padding: 8px 20px;
  }

  /* ====== HEADER / NAVBAR ====== */
  .menu-toggle { display: none; }
  .header {
    position: fixed;
    top: 0;
    left: 220px;
    right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 48px;
    height: 68px;
    background: linear-gradient(180deg, rgba(20,20,20,0.95) 0%, rgba(20,20,20,0) 100%);
    transition: background var(--transition);
  }
  .header.scrolled {
    background: rgba(20,20,20,0.98);
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  /* ====== MAIN CONTENT ====== */
  .main {
    padding-top: 90px;
    padding-left: 48px;
    padding-right: 48px;
    padding-bottom: 80px;
    max-width: 1600px;
    margin: 0 0 0 220px;
  }

  /* ====== HERO / BANNER ====== */
  .hero {
    position: relative;
    width: 100%;
    padding: 32px 48px;
    border-radius: var(--radius-lg);
    margin-bottom: 32px;
    background: linear-gradient(135deg, var(--bg2) 0%, var(--surface) 100%);
  }
  .hero-bg {
    display: none;
  }
  .hero-content {
    position: relative;
    z-index: 2;
  }
  .hero h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .hero p {
    font-size: 14px;
    color: var(--text2);
  }
  .hero-badge {
    display: none;
  }

  /* ====== GENRE SECTION ====== */
  .genre-section {
    margin-bottom: 28px;
  }
  .genre-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    cursor: pointer;
    transition: opacity var(--transition);
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .genre-header:hover {
    opacity: 0.8;
  }
  .genre-title {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .genre-title .arrow {
    font-size: 14px;
    color: var(--primary);
    opacity: 0.6;
  }
  .genre-count {
    font-size: 13px;
    font-weight: 400;
    color: var(--text3);
  }
  .genre-movies-preview {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
  }
  .genre-movies-preview::-webkit-scrollbar { height: 4px; }
  .genre-movies-preview::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .preview-card {
    flex: 0 0 130px;
    aspect-ratio: 2/3;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform var(--transition);
    background: var(--surface);
  }
  .preview-card:hover {
    transform: scale(1.08);
    z-index: 2;
  }
  .preview-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview-card .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--text3);
    background: linear-gradient(135deg, var(--bg2), var(--surface));
  }

  /* ====== EMPTY GENRE ====== */
  .empty-genre {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 20px;
    border-radius: var(--radius);
    background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all var(--transition);
  }
  .empty-genre:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.15);
  }
  .empty-genre-icon {
    font-size: 32px;
    opacity: 0.3;
  }
  .empty-genre-info h4 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .empty-genre-info p {
    font-size: 13px;
    color: var(--text3);
  }
  .empty-genre .click-hint {
    margin-left: auto;
    font-size: 13px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ====== MOVIE GRID (dentro do género) ====== */
  .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  /* ====== MOVIE CARD ====== */
  .movie-card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all var(--transition);
    background: var(--surface);
    aspect-ratio: 2/3;
  }
  .movie-card:hover {
    transform: scale(1.05);
    z-index: 5;
    box-shadow: var(--shadow);
  }
  .movie-card-poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform var(--transition);
  }
  .movie-card-poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: var(--text3);
    background: linear-gradient(135deg, var(--bg2), var(--surface));
  }
  .movie-card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 50%);
    opacity: 0;
    transition: opacity var(--transition);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
  }
  .movie-card:hover .movie-card-overlay {
    opacity: 1;
  }
  .movie-card-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .movie-card-subtitle {
    font-size: 12px;
    color: var(--text2);
  }

  /* ====== EMPTY STATE ====== */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text3);
  }
  .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text2); }
  .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

  /* ====== LOADING ====== */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    gap: 12px;
    color: var(--text2);
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ====== PLAYER OVERLAY ====== */
  .player-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease;
  }
  .player-overlay.active { display: flex; align-items: center; justify-content: center; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .player-container {
    position: relative;
    width: 90vw;
    max-width: 1200px;
    height: 85vh;
    background: #000;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    animation: scaleIn 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .player-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--text2);
    font-size: 15px;
    background: rgba(0,0,0,0.7);
    z-index: 5;
  }
  .player-loading .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .player-error {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text2);
    font-size: 15px;
    background: rgba(0,0,0,0.85);
    z-index: 5;
  }
  .player-error .error-icon { font-size: 48px; }
  .player-error .retry-btn {
    margin-top: 8px;
    padding: 10px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    transition: background var(--transition);
  }
  .player-error .retry-btn:hover { background: var(--primary-hover); }

  .player-container video {
    width: 100%;
    display: block;
    flex: 1;
    min-height: 0;
    object-fit: contain;
    max-height: none;
  }

  /* Cinema-style subtitles — amarelo com borda preta */
  video::cue {
    color: #ffd700;
    background: transparent;
    font-family: 'Arial', 'Helvetica', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000,
       0px  0px 4px #000,
       0px  0px 8px rgba(0,0,0,0.6);
    line-height: 1.5;
  }
  video::cue(b) {
    font-weight: 900;
  }
  video::cue(i) {
    font-style: italic;
  }

  .player-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .player-container:hover .player-header {
    opacity: 1;
    pointer-events: all;
  }
  .player-container:hover .player-header .player-close {
    pointer-events: all;
  }
  .player-header .movie-name {
    font-size: 16px;
    font-weight: 600;
  }
  .player-close {
    background: none;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background var(--transition);
  }
  .player-close:hover { background: rgba(255,255,255,0.15); }

  .player-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .subtitle-size-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: all;
    transition: all 0.2s;
  }
  .subtitle-size-btn:hover {
    background: rgba(255,193,7,0.25);
    border-color: #ffc107;
  }

  .copy-url-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: all;
    transition: all 0.2s;
  }
  .copy-url-btn:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.3);
  }
  .copy-url-btn.copied {
    background: rgba(46,204,113,0.25);
    border-color: #2ecc71;
    color: #2ecc71;
  }

  .subtitle-size-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: all;
    transition: all 0.2s;
  }
  .subtitle-size-btn:hover {
    background: rgba(255,193,7,0.25);
    border-color: #ffc107;
  }

  .cast-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: all;
    transition: all 0.2s;
  }
  .cast-btn:hover {
    background: rgba(229,9,20,0.2);
    border-color: var(--primary);
  }
  .cast-btn.casting {
    background: rgba(229,9,20,0.25);
    border-color: var(--primary);
    color: var(--primary);
  }
  .cast-btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .player-info {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: all;
    transition: all 0.2s;
  }
  .cast-btn:hover {
    background: rgba(229,9,20,0.2);
    border-color: var(--primary);
  }
  .cast-btn.casting {
    background: rgba(229,9,20,0.25);
    border-color: var(--primary);
    color: var(--primary);
  }
  .cast-btn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text2);
    padding: 0 20px 16px;
  }
  .player-info .file-size { color: var(--text3); }
  .player-info .stream-status {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: var(--text3);
    white-space: nowrap;
  }
  .player-info .stream-status.buffering {
    color: #ffa726;
    background: rgba(255,167,38,0.12);
  }
  .player-info .stream-status.seeking {
    color: #42a5f5;
    background: rgba(66,165,245,0.12);
  }
  .player-info .stream-status.cached {
    color: #66bb6a;
    background: rgba(102,187,106,0.12);
  }

  /* ====== MOVIE INFO OVERLAY ====== */
  .movie-info-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1500;

  .movie-info-breadcrumb {
    display: none;

    top: 0;
    left: 220px;
    right: 0;
    z-index: 3002;
    padding: 16px 24px;
    font-size: 13px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);

  }

  .movie-info-bg {
    position: fixed;

  .movie-info-content {

  .movie-info-poster .placeholder {

  .movie-info-details {

  .movie-info-details .badge {

  .movie-info-meta {

  .movie-info-meta .meta-item {

  .btn-play {

  .movie-info-files {

  /* ====== NFO METADATA ====== */

  .movie-meta-row {

  /* ====== RESPONSIVE ====== */
  @media (max-width: 1024px) {
    .main { padding-left: 24px; padding-right: 24px; }

</style>
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="header" id="header">
    <div class="header-right" style="flex:1;justify-content:center">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Pesquisar filmes..." onkeydown="if(event.key==='Enter') search()">
      </div>
    </div>
  </header>

  <!-- ====== BREADCRUMB ====== -->
  <div class="main" id="main">
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- ====== HERO BANNER ====== -->
    <div class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-content">
        <div class="hero-badge">📺 TicianoFlix</div>
        <h1 id="heroTitle">Seus Filmes, Sua Tela</h1>
        <p id="heroDesc">Navegue pelos seus filmes do Google Drive com estilo Netflix.</p>
      </div>
    </div>

    <!-- ====== CONTENT ====== -->
    <div id="content"></div>
  </div>

  <!-- ====== TOAST NOTIFICATION ====== -->
  <div class="toast" id="toast"></div>

  <!-- ====== SIDEBAR ====== -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo-text">▶ TicianoFlix</span>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <button class="sidebar-item active" onclick="loadPath('')">
        <span class="icon">🏠</span> Início
      </button>
      <div class="sidebar-section-title">Gêneros</div>
      <div id="sidebarGenres"></div>
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-item" onclick="backupDb()" title="Exportar banco de dados">
        <span class="icon">💾</span> Exportar
      </button>
      <button class="sidebar-item" onclick="document.getElementById('restoreInput').click()" title="Importar banco de dados">
        <span class="icon">📂</span> Importar
      </button>
      <input type="file" id="restoreInput" accept=".db" style="display:none" onchange="restoreDb(this)">
      <button id="refreshBtn" class="sidebar-item" onclick="refreshCache()" title="Atualizar filmes do Google Drive">
        <span class="icon">🔄</span> Atualizar
      </button>
    </div>
  </div>

  <!-- ====== PLAYER OVERLAY ====== -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-container">
      <div class="player-header">
        <span class="movie-name" id="playerMovieName">Carregando...</span>
        <div class="player-header-right">
          <button class="copy-url-btn" id="copyUrlBtn" onclick="copyStreamUrl()" title="Copiar URL da stream">
            <span>🔗</span>
            <span class="sub-label">URL</span>
          </button>
          <button class="subtitle-size-btn" id="subtitleSizeBtn" onclick="cycleSubtitleSize()" title="Tamanho da legenda">
            <span>🔤</span>
            <span class="sub-label" id="subtitleSizeLabel">Méd</span>
          </button>
          <button class="player-close" onclick="closePlayer()">✕</button>
        </div>
      </div>
      <div class="player-loading" id="playerLoading">
        <div class="spinner"></div>
        <span>Preparando vídeo do Google Drive...</span>
      </div>
      <div class="player-error" id="playerError">
        <div class="error-icon">❌</div>
        <span class="error-msg">Erro ao carregar vídeo</span>
        <button class="retry-btn" onclick="retryPlay()">Tentar novamente</button>
      </div>
      <video id="videoPlayer" controls style="display:none">
        <track kind="subtitles" id="subtitleTrack" srclang="pt-BR" label="Português" default>
      </video>
      <div class="player-info">
        <span id="playerMovieSubtitle"></span>
        <span class="file-size" id="playerFileSize"></span>
        <span class="stream-status" id="streamStatus"></span>
      </div>
    </div>
  </div>

  <!-- ====== MOVIE INFO OVERLAY ====== -->
  <div class="movie-info-breadcrumb" id="movieInfoBreadcrumb"></div>
  <div class="movie-info-overlay" id="movieInfoOverlay">
    <div class="movie-info-bg" id="movieInfoBg"></div>
    <div class="movie-info-content" id="movieInfoContent"></div>
  </div>

<script>
  // ==================== STATE ====================
  let currentPath = "";

  // ==================== API ====================
  async function apiFetch(endpoint) {
    try {
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (e) {
      console.error("API error:", e);
      return null;
    }
  }

  function streamUrl(filePath) {
    return '/api/stream?path=' + encodeURIComponent(filePath);
  }

  function posterUrl(folderPath, imageName) {
    if (!imageName) return null;
    const fullPath = folderPath + '/' + imageName;
    return '/api/stream?path=' + encodeURIComponent(fullPath);
  }

  // ==================== FORMAT ====================
  function formatSize(bytes) {
    if (!bytes) return '';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(1) + ' ' + units[i];
  }

  function formatDate(t) {
    if (!t) return '';
    const d = new Date(t);
    return d.toLocaleDateString('pt-BR');
  }

  function fileIcon(name) {
    const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
    const icons = { '.mp4': '🎬', '.mkv': '🎥', '.avi': '🎞', '.mov': '🎬', '.wmv': '🎬', '.flv': '🎬', '.webm': '🎬', '.m4v': '🎬' };
    return icons[ext] || '📹';
  }

  // ==================== SIMPLE FRONTEND CACHE ====================
  const _frontCache = {};
  const _CACHE_TTL = 120000; // 2 min

  function cachedFetch(url) {
    const now = Date.now();
    const entry = _frontCache[url];
    if (entry && (now - entry.time) < _CACHE_TTL) {
      return Promise.resolve(entry.data);
    }
    return apiFetch(url).then(data => {
      _frontCache[url] = { data, time: Date.now() };
      return data;
    });
  }

  // Override apiFetch calls to use cache where possible
  // ==================== SEARCH ====================
  function search() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { loadPath(''); return; }
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><span>Pesquisando...</span></div>';

    cachedFetch('/api/search?q=' + encodeURIComponent(q)).then(data => {
      if (!data || !data.results) {
        document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">😕</div><h3>Erro na pesquisa</h3></div>';
        return;
      }
      renderResults(data.results, q);
    });
  }

  function renderResults(results, query) {
    const container = document.getElementById('content');
    if (results.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h3>Nenhum resultado encontrado</h3>
          <p>Tente outro termo de busca.</p>
        </div>
        <div class="genre-section">
          <div class="genre-header" onclick="loadPath('')">
            <div class="genre-title"><span class="arrow">←</span> Voltar ao início</div>
          </div>
        </div>`;
      return;
    }

    // Group by directory
    const groups = {};
    results.forEach(item => {
      const dir = item.Path ? item.Path.replace('/' + item.Name, '') : '';
      const key = dir || '/';
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
    });

    const groupKeys = Object.keys(groups);
    let html = `<div class="genre-section">
      <div class="genre-header" style="cursor:default;border:none">
        <div class="genre-title">🔍 Resultados para "${query}" <span class="genre-count">(${results.length})</span></div>
      </div>`;

    groupKeys.forEach(key => {
      const items = groups[key];
      const displayPath = key === '/' ? 'Raiz' : key;
      html += `<div style="margin-bottom:16px">
        <div style="font-size:14px;color:var(--text3);margin-bottom:8px;padding:0 4px">📁 ${escHtml(displayPath)}</div>
        <div class="movie-grid">`;
      items.forEach(item => {
        const name = item.Name || '';
        const filePath = item.Path ? '/' + item.Path : '';
        const posterSrc = item.poster ? posterUrl(filePath.replace(/\/[^/]*$/, ''), item.poster) : null;
        html += renderMovieCardHtml(name, filePath, item.Size, posterSrc);
      });
      html += `</div></div>`;
    });

    html += `</div>
      <div class="genre-section">
        <div class="genre-header" onclick="loadPath('')">
          <div class="genre-title"><span class="arrow">←</span> Voltar ao início</div>
        </div>
      </div>`;

    container.innerHTML = html;
    document.getElementById('hero').style.display = 'none';
  }

  // ==================== SIDEBAR ====================
  let _sidebarGenresLoaded = false;

  function loadSidebarGenres() {
    const container = document.getElementById('sidebarGenres');
    if (_sidebarGenresLoaded) return;
    _sidebarGenresLoaded = true;
    cachedFetch('/api/genres').then(data => {
      if (!data || !data.folders) return;
      let html = '';
      data.folders.forEach(g => {
        const name = g.Name || '';
        const path = '/TicianoFlix/' + name;
        html += '<button class="sidebar-item" onclick="loadPath(\'' + path.replace(/'/g, "\\'") + '\')">'
          + '<span class="icon">' + genreIcon(name) + '</span> '
          + escHtml(name) + '</button>';
      });
      container.innerHTML = html;
    });
  }

  // ==================== HOME / GENRE LIST ====================
  function loadPath(path) {
    currentPath = path;
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div><span>Carregando...</span></div>';
    document.getElementById('searchInput').value = '';

    // Close any open info overlay
    closeMovieInfo();

    const isHome = isHomePage(path);
    const url = isHome ? '/api/genres' : ('/api/list?path=' + encodeURIComponent(path));

    cachedFetch(url).then(data => {
      if (!data) {
        document.getElementById('content').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><h3>Erro ao carregar</h3><p>Não foi possível conectar ao servidor.</p></div>';
        return;
      }
      renderDirectory(data);
    });
  }

  function isHomePage(path) {
    return path === '' || path === '/' || path === '/TicianoFlix';
  }

  function renderDirectory(data) {
    const container = document.getElementById('content');
    const hero = document.getElementById('hero');
    hero.style.display = 'block';

    const isHome = isHomePage(data.path);

    if (!isHome) {
      renderBreadcrumb(data.path);
    } else {
      document.getElementById('breadcrumb').innerHTML = '';
    }
    const hasFolders = data.folders && data.folders.length > 0;
    const hasVideos = data.videos && data.videos.length > 0;
    const hasImages = data.images && data.images.length > 0;

    // If we're in a genre (1 level deep, has movie subfolders)
    if (!isHome && hasFolders && !hasVideos) {
      renderGenreView(container, data);
      return;
    }

    // If we're in a folder with videos directly
    if (!isHome && hasVideos) {
      renderVideoView(container, data);
      return;
    }

    // HOME PAGE: show all genres as sections
    if (isHome) {
      renderHomeView(container, data);
      return;
    }

    // Empty state
    if (!hasFolders && !hasVideos && !hasImages) {
      renderEmptyState(container, data.path);
      return;
    }

    // Fallback: show folders and videos
    renderGenericView(container, data);
  }

  // ===== HOME VIEW: summary + recent movies =====
  function renderHomeView(container, data) {
    const hero = document.getElementById('hero');
    hero.style.display = 'none';
    document.getElementById('heroTitle').textContent = '';
    document.getElementById('heroDesc').textContent = '';
    document.getElementById('heroBg').style.backgroundImage = 'none';

    const folders = data.folders || [];
    const totalGenres = folders.length;
    let totalMovies = 0;
    folders.forEach(g => { if (g.Name) totalMovies++; });

    container.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px">
        <div style="background:var(--surface);border-radius:var(--radius-lg);padding:24px;text-align:center;border:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:36px;margin-bottom:8px">🎬</div>
          <div style="font-size:28px;font-weight:800">${totalGenres}</div>
          <div style="font-size:13px;color:var(--text3)">Gêneros</div>
        </div>
        <div style="background:var(--surface);border-radius:var(--radius-lg);padding:24px;text-align:center;border:1px solid rgba(255,255,255,0.06)">
          <div style="font-size:36px;margin-bottom:8px">📀</div>
          <div style="font-size:28px;font-weight:800">—</div>
          <div style="font-size:13px;color:var(--text3)">Filmes</div>
        </div>
      </div>
      <div class="genre-section">
        <div class="genre-header" style="cursor:default;border:none">
          <div class="genre-title">📥 Últimos Adicionados</div>
        </div>
        <div class="movie-grid" id="recentGrid">
          <div class="loading"><div class="spinner"></div><span>Carregando...</span></div>
        </div>
      </div>`;

    // Fetch first movie from each genre to show as "recent"
    let allMovies = [];
    let loaded = 0;
    folders.forEach((genre, gi) => {
      const genrePath = '/TicianoFlix/' + (genre.Name || '');
      cachedFetch('/api/list?path=' + encodeURIComponent(genrePath)).then(listData => {
        if (listData && listData.folders) {
          listData.folders.forEach(f => {
            allMovies.push({ path: (genrePath + '/' + f.Name), name: f.Name });
          });
        }
        loaded++;
        if (loaded === folders.length) {
          renderRecentMovies(allMovies);
        }
      });
    });

    function renderRecentMovies(movies) {
      const grid = document.getElementById('recentGrid');
      if (!grid) return;
      if (movies.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>Nenhum filme ainda</h3></div>';
        return;
      }
      // Show last 12 (or fewer)
      const recent = movies.slice(-12).reverse();
      // Update total count in stats card
      const statCards = container.querySelectorAll('div[style*="grid-template-columns"]');
      // Find the movies count card and update it
      const allStatDivs = container.querySelectorAll('div[style*="background:var(--surface)"]');
      if (allStatDivs.length >= 2) {
        const countEl = allStatDivs[1].querySelector('div[style*="font-size:28px"]');
        if (countEl) countEl.textContent = movies.length;
      }

      let html = '';
      recent.forEach(m => {
        const nameClean = (m.name || '').replace(/[._]/g, ' ').replace(/\.[^.]+$/, '');
        const safePath = m.path.replace(/'/g, "\\'");
        html += '<div class="movie-card" onclick="showMovieInfo(\'' + safePath + '\', event)" title="' + escHtml(m.name) + '">'
          + '<div class="movie-card-poster-placeholder" style="display:flex">🎬</div>'
          + '<div class="movie-card-overlay">'
          + '<div class="movie-card-title">' + escHtml(nameClean) + '</div>'
          + '</div></div>';
        // Load poster
        cachedFetch('/api/movie-detail?path=' + encodeURIComponent(m.path)).then(detail => {
          if (!detail || !detail.poster) return;
          const cards = grid.querySelectorAll('.movie-card');
          const idx = recent.indexOf(m);
          if (cards[idx]) {
            const img = document.createElement('img');
            img.className = 'movie-card-poster';
            img.src = posterUrl(m.path, detail.poster.Name);
            img.alt = escHtml(m.name);
            img.style.cssText = 'width:100%;height:100%;object-fit:cover;position:absolute;inset:0';
            img.onerror = () => img.remove();
            cards[idx].appendChild(img);
          }
        });
      });
      grid.innerHTML = html;
    }
  }

  function genreIcon(name) {
    const icons = {
      'terror': '👻', 'horror': '👻',
      'comedia': '😂', 'comédia': '😂',
      'acao': '💥', 'acção': '💥', 'ação': '💥',
      'drama': '🎭',
      'ficcao': '🚀', 'ficção': '🚀', 'sci-fi': '🚀',
      'shows': '📺', 'series': '📺', 'séries': '📺',
      'documentario': '📽', 'documentário': '📽',
      'romance': '💕',
      'aventura': '🗺',
      'animacao': '🎨', 'animação': '🎨',
      'suspense': '🔪',
      'trash': '🍿',
      'acervo': '📚',
    };
    const key = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return icons[key] || '🎬';
  }

  async function fetchGenrePreview(genrePath, idx) {
    const data = await cachedFetch('/api/list?path=' + encodeURIComponent(genrePath));
    const el = document.getElementById('preview-' + idx);
    if (!el) return;

    if (!data) {
      el.innerHTML = '<div class="empty-genre" onclick="loadGenre(\'' + genrePath.replace(/'/g, "\\'") + '\',\'\')"><div class="empty-genre-icon">❌</div><div class="empty-genre-info"><h4>Erro ao carregar</h4></div></div>';
      return;
    }

    const movieFolders = data.folders || [];
    const directVideos = data.videos || [];

    if (movieFolders.length === 0 && directVideos.length === 0) {
      el.innerHTML = `<div class="empty-genre" onclick="loadGenre('${genrePath.replace(/'/g, "\\'")}', '')">
        <div class="empty-genre-icon">📭</div>
        <div class="empty-genre-info">
          <h4>Nenhum filme ainda</h4>
          <p>Adicione filmes nesta pasta para vê-los aqui.</p>
        </div>
        <div class="click-hint">Clique para entrar <span class="arrow">→</span></div>
      </div>`;
      return;
    }

    // Show movies as horizontal preview cards
    let items = movieFolders.slice(0, 8);
    let html = '';
    let loadedCount = 0;

    items.forEach((movie, mi) => {
      const movieName = movie.Name || '';
      const moviePath = genrePath + '/' + movieName;
      const uniqueId = 'preview-img-' + idx + '-' + mi;

      html += `<div class="preview-card" onclick="showMovieInfo('${moviePath.replace(/'/g, "\\'")}', event)" title="${escHtml(movieName)}">
        <div class="placeholder" id="${uniqueId}">🎬</div>
      </div>`;

      // Load poster lazily
      cachedFetch('/api/movie-detail?path=' + encodeURIComponent(moviePath)).then(detail => {
        const imgEl = document.getElementById(uniqueId);
        if (!imgEl) return;
        loadedCount++;
        if (detail && detail.poster) {
          const img = document.createElement('img');
          img.src = posterUrl(moviePath, detail.poster.Name);
          img.alt = escHtml(movieName);
          img.loading = 'lazy';
          img.onerror = () => { imgEl.textContent = '🎬'; };
          imgEl.parentNode.replaceChild(img, imgEl);
        } else {
          imgEl.textContent = '🎬';
        }
      });
    });

    if (movieFolders.length > 8) {
      html += `<div class="preview-card" onclick="loadGenre('${genrePath.replace(/'/g, "\\'")}', '')" style="display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--text2);background:var(--bg2)">
        +${movieFolders.length - 8}
      </div>`;
    }

    el.innerHTML = html;
  }

  // ===== GENRE VIEW: show movie folders as cards =====
  function renderGenreView(container, data) {

      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>

    }

    let html = `<div class="genre-section">
      <div class="genre-header" style="cursor:default;border:none;padding-bottom:4px">

      </div>

      html += renderMovieFolderCard(name, folderPath);
    });

    // Also show any direct videos
    directVideos.forEach(video => {
      const name = video.Name || '';

    movieFolders.forEach(folder => {

      const folderPath = (data.path ? data.path + '/' : '') + name;
      const imgId = 'poster-' + encodeURIComponent(folderPath).replace(/%/g, '_');
      cachedFetch('/api/movie-detail?path=' + encodeURIComponent(folderPath)).then(detail => {

          imgEl.style.display = 'none';
          if (imgEl.nextElementSibling) imgEl.nextElementSibling.style.display = 'flex';
        }
      });
    });

    // Load hero background from first movie's fanart or poster - REMOVED, simple header only
  }

  function renderMovieFolderCard(name, folderPath) {
    const encodedPath = encodeURIComponent(folderPath).replace(/%/g, '_');
    const nameClean = name.replace(/[._]/g, ' ');
    const yearMatch = name.match(/(\d{4})/);
    const year = yearMatch ? yearMatch[1] : '';
    const safePath = folderPath.replace(/'/g, "\\'");

    return `
      <div class="movie-card" onclick="showMovieInfo('${safePath}', event)" title="${escHtml(name)}">
        <img class="movie-card-poster" id="poster-${encodedPath}" src="" alt="${escHtml(name)}" style="display:none">
        <div class="movie-card-poster-placeholder" id="ph-${encodedPath}">🎬</div>
        <div class="movie-card-overlay">
          <div class="movie-card-title">${escHtml(nameClean)}</div>
          <div class="movie-card-subtitle">${year ? year : 'Filme'}</div>
        </div>
      </div>`;

  // ===== MOVIE CARD HTML =====
  function renderMovieCardHtml(name, filePath, size, posterSrc) {
    const nameClean = name.replace(/\.[^.]+$/, '').replace(/[._]/g, ' ');
    const safePath = filePath.replace(/'/g, "\\'");
    const safeName = escHtml(name).replace(/'/g, "\\'");
    const yearMatch = name.match(/(\d{4})/);
    const year = yearMatch ? yearMatch[1] : '';

    let html = `
      <div class="movie-card" onclick="playMovie('${safePath}', '${safeName}')" title="${escHtml(name)}">`;

    if (posterSrc) {
      html += `<img class="movie-card-poster" src="${posterSrc}" alt="${escHtml(name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`;
      html += `<div class="movie-card-poster-placeholder" style="display:none">${fileIcon(name)}</div>`;
    } else {
      html += `<div class="movie-card-poster-placeholder">${fileIcon(name)}</div>`;
    }

    html += `
        <div class="movie-card-overlay">
          <div class="movie-card-title">${escHtml(nameClean)}</div>
          <div class="movie-card-subtitle">${formatSize(size)}${year ? ' • ' + year : ''}</div>
        </div>
      </div>`;
    return html;
  }

  // ===== MOVIE INFO =====
  let currentMovieFolder = null;

  function showMovieInfo(folderPath, event) {
    if (event) event.stopPropagation();
    currentMovieFolder = folderPath;

    const overlay = document.getElementById('movieInfoOverlay');
    const content = document.getElementById('movieInfoContent');
    const bg = document.getElementById('movieInfoBg');

    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    document.getElementById('movieInfoBreadcrumb').style.display = 'block';

    // Build breadcrumb for the overlay
    const bcEl = document.getElementById('movieInfoBreadcrumb');
    const path = folderPath || '';
    const parts = path.split('/').filter(Boolean);
    let cur = '/TicianoFlix';
    let html = '<a onclick="loadPath(\'\')">🏠 Início</a>';
    parts.forEach((p, i) => {
      if (i === 0) return; // skip TicianoFlix root
      cur += '/' + p;
      const name = p.replace(/[._]/g, ' ');
      if (i === parts.length - 1) {
        html += ' <span class="sep">›</span> <span>' + escHtml(name) + '</span>';
      } else {
        html += ' <span class="sep">›</span> <a onclick="loadPath(\'' + cur.replace(/'/g, "\\'") + '\')">' + escHtml(name) + '</a>';
      }
    });
    bcEl.innerHTML = html;

    content.innerHTML = '<div class="loading" style="min-height:400px"><div class="spinner"></div><span>Carregando informações...</span></div>';
    bg.style.backgroundImage = 'none';

    cachedFetch('/api/movie-detail?path=' + encodeURIComponent(folderPath)).then(detail => {
      if (!detail) {
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><h3>Erro ao carregar</h3></div>';
        return;
      }

      const title = detail.title || 'Filme';
      const titleClean = title.replace(/[._]/g, ' ');
      const year = detail.year || '';
      const video = detail.video;
      const poster = detail.poster;
      const fanart = detail.fanart;
      const subtitle = detail.subtitle;
      const nfo = detail.nfo;

      // Background fanart
      if (fanart) {
        bg.style.backgroundImage = 'url(' + posterUrl(folderPath, fanart.Name) + ')';
      } else if (poster) {
        bg.style.backgroundImage = 'url(' + posterUrl(folderPath, poster.Name) + ')';
      }

      // Poster image
      const posterImg = poster
        ? '<img src="' + posterUrl(folderPath, poster.Name) + '" alt="' + escHtml(titleClean) + '">'
        : '<div class="placeholder">🎬</div>';

      const videoPath = video ? (folderPath + '/' + video.Name) : null;

      // ---- NFO RICH CONTENT ----
      let nfoHtml = '';

      // Rating stars
      if (nfo && nfo.rating) {
        const r = parseFloat(nfo.rating);
        const full = Math.floor(r / 2);
        const half = r % 2 >= 1 ? 1 : 0;
        const stars = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(Math.max(0, 5 - full - half));
        nfoHtml += `<div class="movie-rating">
          <span class="stars">${stars}</span>
          <span class="num">${nfo.rating}</span>
          ${nfo.votes ? '<span class="votes">(' + nfo.votes + ' votos)</span>' : ''}
        </div>`;
      }

      // Genres
      if (nfo && nfo.genres && nfo.genres.length > 0) {
        nfoHtml += '<div class="movie-genres">';
        nfo.genres.forEach(g => { nfoHtml += '<span class="movie-genre-tag">' + escHtml(g) + '</span>'; });
        nfoHtml += '</div>';
      }

      // Tagline
      if (nfo && nfo.tagline) {
        nfoHtml += '<div class="movie-tagline">"' + escHtml(nfo.tagline) + '"</div>';
      }

      // Plot
      if (nfo && nfo.plot) {
        nfoHtml += '<div class="movie-plot">' + escHtml(nfo.plot) + '</div>';
      }

      // Metadata row: runtime, mpaa, country, year, premiered
      let metaParts = [];
      if (nfo && nfo.runtime) metaParts.push('<span><span class="label">Duração</span> ' + nfo.runtime + ' min</span>');
      if (nfo && nfo.mpaa) metaParts.push('<span><span class="label">Classificação</span> ' + escHtml(nfo.mpaa) + '</span>');
      if (year) metaParts.push('<span><span class="label">Ano</span> ' + year + '</span>');
      if (nfo && nfo.premiered) metaParts.push('<span><span class="label">Estreia</span> ' + nfo.premiered + '</span>');
      if (nfo && nfo.country && nfo.country.length > 0) metaParts.push('<span><span class="label">País</span> ' + nfo.country.join(', ') + '</span>');
      if (nfo && nfo.source) metaParts.push('<span><span class="label">Fonte</span> ' + nfo.source + '</span>');
      if (metaParts.length > 0) {
        nfoHtml += '<div class="movie-meta-row">' + metaParts.join('') + '</div>';
      }

      // Directors / Writers
      let creditsHtml = '';
      if (nfo && nfo.directors && nfo.directors.length > 0) {
        creditsHtml += '<span><span class="label">Diretor</span> ' + nfo.directors.join(', ') + '</span>';
      }
      if (nfo && nfo.writers && nfo.writers.length > 0) {
        creditsHtml += '<span><span class="label">Roteiro</span> ' + nfo.writers.join(', ') + '</span>';
      }
      if (nfo && nfo.studios && nfo.studios.length > 0) {
        creditsHtml += '<span><span class="label">Estúdio</span> ' + nfo.studios.join(', ') + '</span>';
      }
      if (creditsHtml) {
        nfoHtml += '<div class="movie-meta-row">' + creditsHtml + '</div>';
      }

      // Cast
      if (nfo && nfo.actors && nfo.actors.length > 0) {
        nfoHtml += '<div class="movie-cast"><h4>Elenco</h4><div class="movie-cast-grid">';
        // Show top 12 actors
        nfo.actors.slice(0, 12).forEach(a => {
          nfoHtml += '<div class="cast-item"><span class="name">' + escHtml(a.name) + '</span> <span class="role">' + escHtml(a.role || '') + '</span></div>';
        });
        nfoHtml += '</div></div>';
      }

      // Tags
      if (nfo && nfo.tags && nfo.tags.length > 0) {
        nfoHtml += '<div class="movie-tags">';
        nfo.tags.forEach(t => { nfoHtml += '<span class="movie-tag">#' + escHtml(t.replace(/[^a-z0-9]/gi, '')) + '</span>'; });
        nfoHtml += '</div>';
      }

      // ---- BUILD FINAL HTML ----
      let html = `
        <div class="movie-info-poster">
          ${posterImg}
        </div>
        <div class="movie-info-details">
          ${year ? '<div class="badge">' + year + '</div>' : ''}
          <h1>${escHtml(titleClean)}</h1>
          ${nfoHtml}

          <div class="movie-info-meta">
            ${video ? '<div class="meta-item">📦 <span class="label">Tamanho</span> ' + formatSize(video.Size) + '</div>' : ''}
            ${video ? '<div class="meta-item">🎞 <span class="label">Formato</span> ' + (video.Name ? video.Name.split('.').pop().toUpperCase() : '') + '</div>' : ''}
            ${subtitle ? '<div class="meta-item">💬 <span class="label">Legenda</span> ' + formatSize(subtitle.Size) + '</div>' : '<div class="meta-item">💬 <span class="label">Legenda</span> Não</div>'}
          </div>

          <div class="movie-info-actions">
            ${videoPath ? '<button class="btn-play" onclick="playFromInfo(\'' + videoPath.replace(/'/g, "\\'") + '\', \'' + escHtml(titleClean).replace(/'/g, "\\'") + '\' ' + (subtitle ? ', \'' + (folderPath + '/' + subtitle.Name).replace(/'/g, "\\'") + '\'' : '') + ')">▶ Assistir</button>' : '<button class="btn-play" disabled style="opacity:0.4">▶ Indisponível</button>'}
          </div>
        </div>`;

      content.innerHTML = html;
    });
  }

  // ==================== BREADCRUMB ====================
  function renderBreadcrumb(path) {
    const el = document.getElementById('breadcrumb');
    if (!el) return;
    const parts = path ? path.split('/').filter(Boolean) : [];
    let current = '/TicianoFlix';

      }

    el.innerHTML = html;
  }

  // ==================== PLAYER ====================
  let currentVideoPath = null;
  let currentSubtitlePath = null;
  let _bufferTimer = null;
  let _bufferSafetyTimeout = null;

  function clearBufferTimer() {
    if (_bufferTimer) { clearInterval(_bufferTimer); _bufferTimer = null; }
    if (_bufferSafetyTimeout) { clearTimeout(_bufferSafetyTimeout); _bufferSafetyTimeout = null; }
  }

  function playMovie(filePath, movieName, subtitlePath) {
    const overlay = document.getElementById('playerOverlay');
    const video = document.getElementById('videoPlayer');
    const loading = document.getElementById('playerLoading');
    const movieTitle = document.getElementById('playerMovieName');
    const movieSubtitle = document.getElementById('playerMovieSubtitle');

    currentVideoPath = filePath;
    currentSubtitlePath = subtitlePath || null;
    movieTitle.textContent = movieName.replace(/\.[^.]+$/, '').replace(/[._]/g, ' ');
    movieSubtitle.textContent = filePath;
    document.getElementById('playerFileSize').textContent = '';

    // Limpa qualquer timer de buffer pendente
    clearBufferTimer();

    // Show loading state
    video.style.display = 'none';
    loading.style.display = 'flex';
    document.getElementById('playerError').style.display = 'none';
    loading.querySelector('span').textContent = 'Preparando vídeo do Google Drive...';

    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // Set up video events
    video.onerror = function() {
      clearBufferTimer();
      const err = video.error;
      // MEDIA_ERR_ABORTED é normal durante seeks — ignora
      if (err && err.code === MediaError.MEDIA_ERR_ABORTED) return;
      let msg = 'Erro ao carregar vídeo';
      if (err) {
        if (err.code === MediaError.MEDIA_ERR_NETWORK) msg = 'Falha de rede ao carregar vídeo';
        else if (err.code === MediaError.MEDIA_ERR_DECODE) msg = 'Erro de decodificação — formato não suportado';
        else if (err.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) msg = 'Formato de vídeo não suportado pelo navegador';
      }
      showPlayerError(msg);
    };

    video.oncanplay = function() {
      // Browser pode decodificar — inicia play (só na primeira vez)
      if (!video._started) {
        video._started = true;
        clearBufferTimer();
        loading.style.display = 'none';
        video.style.display = 'block';
        video.play().catch(function() {});
      }
    };

    video.onwaiting = function() {
      if (video.style.display === 'block') {
        loading.style.display = 'flex';
        loading.querySelector('span').textContent = 'Bufferizando...';
      }
    };

    video.onplaying = function() {
      loading.style.display = 'none';
      setStreamStatus('playing', '\u25B6\uFE0F Streaming');
    };

    video.onseeking = function() {
      video._seeking = true;
      setStreamStatus('seeking', '\u23F3 Pulando...');
    };

    video.onseeked = function() {
      video._seeking = false;
      loading.style.display = 'none';
      video.style.display = 'block';
      setStreamStatus('playing', '\u25B6\uFE0F Streaming');
    };

    video.onprogress = function() {
      updateBufferStatus(video);
    };

    // Set up subtitle track
    const track = document.getElementById('subtitleTrack');
    const parent = track.parentNode;
    const newTrack = document.createElement('track');
    newTrack.id = 'subtitleTrack';
    newTrack.kind = 'subtitles';
    newTrack.srclang = 'pt-BR';
    newTrack.label = 'Português';
    newTrack.default = true;
    if (subtitlePath) {
      newTrack.src = '/api/subtitle?path=' + encodeURIComponent(subtitlePath);
    }
    parent.replaceChild(newTrack, track);

    // Se houver legenda, já liga automático
    if (subtitlePath) {
      subtitlesEnabled = true;
      const t = document.getElementById('subtitleTrack');
      if (t) t.track.mode = 'showing';
    } else {
      subtitlesEnabled = false;
    }
    updateSubtitleButton(subtitlePath);

    // Start loading video
    video.src = streamUrl(filePath);
    video.load();

    // Fetch file size in background
    cachedFetch('/api/info?path=' + encodeURIComponent(filePath)).then(info => {
      if (info && info.Size) {
        document.getElementById('playerFileSize').textContent = formatSize(info.Size);
      }
    });

    // Inicia loading — stream começa assim que oncanplay disparar
    loading.querySelector('span').textContent = 'Carregando...';
    setStreamStatus('buffering', '⬇️ 0%');

    // Timeout: se readyState=0 após 25s, é erro de conexão
    setTimeout(function() {
      if (video.readyState === 0) {
        clearBufferTimer();
        showPlayerError('O servidor demorou a responder. Verifique sua conexão com o Google Drive.');
      }
    }, 25000);
  }

  function showPlayerError(msg) {
    const loading = document.getElementById('playerLoading');
    const video = document.getElementById('videoPlayer');
    const errorEl = document.getElementById('playerError');
    loading.style.display = 'none';
    video.style.display = 'none';
    video.src = '';
    errorEl.querySelector('.error-msg').textContent = msg;
    errorEl.style.display = 'flex';
  }

  function retryPlay() {
    if (currentVideoPath) {
      const movieTitle = document.getElementById('playerMovieName');
      const name = movieTitle.textContent;
      playMovie(currentVideoPath, name, currentSubtitlePath);
    }
  }

  function closePlayer() {
    // Confirmação antes de fechar
    if (!confirm('Deseja realmente fechar o filme?')) return;
    const video = document.getElementById('videoPlayer');
    // Não fecha durante seek
    if (video && video._seeking) {
      console.log('[closePlayer] ignorado — seeking em andamento');
      return;
    }
    clearBufferTimer();
    const overlay = document.getElementById('playerOverlay');
    const loading = document.getElementById('playerLoading');
    const errorEl = document.getElementById('playerError');
    video.pause();
    video.src = '';
    video.onerror = null;
    video.oncanplay = null;
    video.onwaiting = null;
    video.onplaying = null;
    video.onseeking = null;
    video.onseeked = null;
    video.onprogress = null;
    loading.style.display = 'none';
    errorEl.style.display = 'none';
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  let subtitlesEnabled = true;
  let subtitleSizeIndex = 1;
  const subtitleSizes = [
    { px: 22, label: 'Peq' },
    { px: 28, label: 'Méd' },
    { px: 36, label: 'Gde' },
    { px: 48, label: 'Ext' },
  ];

  function cycleSubtitleSize() {
    subtitleSizeIndex = (subtitleSizeIndex + 1) % subtitleSizes.length;
    const size = subtitleSizes[subtitleSizeIndex];
    document.getElementById('subtitleSizeLabel').textContent = size.label;
    const style = document.createElement('style');
    style.id = 'subDynamicSize';
    style.textContent = 'video::cue { font-size: ' + size.px + 'px !important; }';
    const old = document.getElementById('subDynamicSize');
    if (old) old.remove();
    document.head.appendChild(style);
  }

  // ══════════════════════════════════════
  //  Google Cast (Chromecast)
  // ══════════════════════════════════════
  let castLoaded = false;
  let castSession = null;
  const CAST_APP_ID = 'CC1AD845'; // Default Media Receiver

  function getMimeType(path) {
    const ext = path.split('.').pop().toLowerCase();
    const types = {
      mp4: 'video/mp4', m4v: 'video/mp4', mkv: 'video/x-matroska',
      webm: 'video/webm', mov: 'video/quicktime', avi: 'video/x-msvideo',
      flv: 'video/x-flv', wmv: 'video/x-ms-wmv', mpg: 'video/mpeg', mpeg: 'video/mpeg',
    };
    return types[ext] || 'video/mp4';
  }

  function loadCastSdk(callback) {
    if (window.chrome && window.chrome.cast) {
      callback();
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js';
    script.onload = callback;
    script.onerror = () => console.warn('[Cast] Falha ao carregar SDK');
    document.body.appendChild(script);
  }

  function initCastApi() {
    if (!window.chrome || !window.chrome.cast) return;
    const ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({
      receiverApplicationId: CAST_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
    });
    ctx.addEventListener(
      cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
      onCastSessionChanged
    );
    castLoaded = true;
    // Enable button if Cast is available
    const btn = document.getElementById('castBtn');
    if (btn) btn.disabled = false;
  }

  function onCastSessionChanged(e) {
    const btn = document.getElementById('castBtn');
    const icon = document.getElementById('castIcon');
    const label = document.getElementById('castLabel');
    castSession = e.session;
    if (e.session && e.session.getSessionState() === 'connected') {
      btn.classList.add('casting');
      btn.title = 'Conectado ao Chromecast';
      icon.textContent = '📡';
      label.textContent = 'Cast';
    } else {
      btn.classList.remove('casting');
      btn.title = 'Transmitir para Chromecast';
      icon.textContent = '📺';
    }
  }

  function startCast() {
    const path = currentVideoPath;
    if (!path) return;

    if (!castLoaded) {
      loadCastSdk(() => {
        initCastApi();
        // Small delay for init, then try again
        setTimeout(() => startCast(), 500);
      });
      return;
    }

    const castCtx = cast.framework.CastContext.getInstance();
    castCtx.requestSession()
      .then(() => {
        const session = castCtx.getCurrentSession();
        if (!session) return;

        const streamUrl = window.location.origin + '/api/stream?path=' + encodeURIComponent(path);
        const movieName = document.getElementById('playerMovieName').textContent;
        const mimeType = getMimeType(path);

        const mediaInfo = new chrome.cast.media.MediaInfo(streamUrl, mimeType);
        mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
        mediaInfo.metadata.title = movieName;
        mediaInfo.metadata.subtitle = 'TicianoFlix';

        // Add subtitle track if available
        if (currentSubtitlePath) {
          const subUrl = window.location.origin + '/api/subtitle?path=' + encodeURIComponent(currentSubtitlePath);
          const track = new chrome.cast.media.Track(1, chrome.cast.media.TrackType.TEXT);
          track.trackContentId = subUrl;
          track.trackContentType = 'text/vtt';
          track.subtype = chrome.cast.media.TextTrackType.SUBTITLES;
          track.name = 'Português';
          track.language = 'pt-BR';
          mediaInfo.tracks = [track];
        }

        const request = new chrome.cast.media.LoadRequest(mediaInfo);
        if (currentSubtitlePath) {
          request.activeTrackIds = [1];
        }

        session.loadMedia(request)
          .then(() => console.log('[Cast] Mídia enviada com sucesso'))
          .catch(err => console.warn('[Cast] Erro ao carregar mídia:', err));
      })
      .catch(err => {
        if (err.code === 'cancel' || err.code === 'CANCEL') return;
        console.warn('[Cast] Erro na sessão:', err);
      });
  }

  function copyStreamUrl() {
    const btn = document.getElementById('copyUrlBtn');
    const path = currentVideoPath;
    if (!path) return;
    const url = window.location.origin + '/api/stream?path=' + encodeURIComponent(path);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        btn.classList.add('copied');
        btn.title = 'Copiado!';
        setTimeout(() => { btn.classList.remove('copied'); btn.title = 'Copiar URL da stream'; }, 2000);
      }).catch(() => fallbackCopy(url, btn));
    } else {
      fallbackCopy(url, btn);
    }
  }

  function fallbackCopy(text, btn) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      btn.classList.add('copied');
      btn.title = 'Copiado!';
      setTimeout(() => { btn.classList.remove('copied'); btn.title = 'Copiar URL da stream'; }, 2000);
    } catch (e) {}
    document.body.removeChild(ta);
  }

  // Close movie info on Escape

  function updateSubtitleButton(subtitlePath) {
    // legenda ativada automaticamente, sem botão toggle
  }

  function setStreamStatus(type, text) {
    const el = document.getElementById('streamStatus');
    if (!el) return;
    el.textContent = text;
    el.className = 'stream-status';
    if (type) el.classList.add(type);
  }

  function updateBufferStatus(video) {
    const el = document.getElementById('streamStatus');
    if (!el) return;
    try {
      if (video.buffered && video.buffered.length > 0 && video.duration > 0) {
        const end = video.buffered.end(video.buffered.length - 1);
        const pct = Math.round((end / video.duration) * 100);
        if (pct < 100) {
          el.textContent = '⬇️ ' + pct + '%';
          el.className = 'stream-status buffering';
        } else {
          el.textContent = '💾 100% cache';
          el.className = 'stream-status cached';
        }
      }
    } catch(e) {
      // silencioso
    }
  }

  document.getElementById('playerOverlay').onclick = function(e) {
    // Apenas o botão fechar e Escape fecham — clique fora não fecha
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closePlayer();
  });

  // ==================== HEADER SCROLL ====================
  window.addEventListener('scroll', function() {
    const header = document.getElementById('header');
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });

  // ==================== UTILS ====================
  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ==================== TOAST ====================
  let toastTimeout = null;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { el.classList.remove('show'); }, 4000);
  }

  // ==================== BACKUP / RESTORE ====================
  async function backupDb() {
    const btn = document.getElementById('backupBtn');
    btn.textContent = '⏳';
    try {
      const res = await fetch('/api/backup');
      if (!res.ok) { showToast('Erro ao exportar banco', 'error'); btn.textContent = '💾'; return; }

      // Get the save path from headers
      const savePath = res.headers.get('X-Backup-Path') || '';

      // Browser fallback: trigger download
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ticianoflix-backup-' + new Date().toISOString().slice(0,10) + '.db';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      if (savePath) {
        showToast('💾 Backup salvo em: ' + savePath, 'success');
      } else {
        showToast('Banco exportado!', 'success');
      }
    } catch(e) {
      showToast('Erro ao exportar: ' + e.message, 'error');
    }
    btn.textContent = '💾';
  }

  async function restoreDb(input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.name.endsWith('.db')) {
      showToast('Selecione um arquivo .db', 'error');
      input.value = '';
      return;
    }

    const btn = document.getElementById('restoreBtn');
    btn.textContent = '⏳';
    showToast('Enviando backup...', '');
    try {
      const formData = new FormData();
      formData.append('backup', file);
      const res = await fetch('/api/restore', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.error) {
        showToast('Erro: ' + data.error, 'error');
      } else {
        showToast('✅ ' + (data.message || 'Banco restaurado!'), 'success');
        setTimeout(() => loadPath(''), 3000);
      }
    } catch(e) {
      showToast('Erro ao restaurar: ' + e.message, 'error');
      console.error('Restore error:', e);
    }
    btn.textContent = '📂';
    input.value = '';
  }

  // ==================== REFRESH CACHE ====================
  async function refreshCache() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');
    btn.textContent = '';

    try {
      await fetch('/api/refresh');
      // Wait a bit for scan to start, then poll for completion
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        const res = await fetch('/api/cache-status');
        const status = await res.json();
        if (status.cached && !status.stale) {
          clearInterval(poll);
          btn.classList.remove('loading');
          btn.textContent = '🔄';
          loadPath(currentPath);
        } else if (attempts > 60) {
          clearInterval(poll);
          btn.classList.remove('loading');
          btn.textContent = '🔄';
          loadPath(currentPath);
        }
      }, 2000);
      // Fallback: reload after 30s even if poll fails
      setTimeout(() => {
        btn.classList.remove('loading');
        btn.textContent = '🔄';
        loadPath(currentPath);
      }, 30000);
    } catch(e) {
      btn.classList.remove('loading');
      btn.textContent = '🔄';
      console.error('Refresh failed:', e.message || e);
    }
  }

  // ==================== INIT ====================
  loadPath("");
  loadSidebarGenres();
</script>
